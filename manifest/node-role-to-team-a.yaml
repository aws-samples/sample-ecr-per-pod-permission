# Node role (default SA, no ECR pull role) pulling from team-a/ namespace — should FAIL ❌
# Uses default SA → no ECR pull role → falls back to node role
# → ECR repo policy on team-a/app denies node role → pull fails
#
# This proves: the node IAM role cannot pull private team images.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-role-to-team-a
  namespace: node-role
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-role-to-team-a
  template:
    metadata:
      labels:
        app: node-role-to-team-a
    spec:
      tolerations:
        - key: "ecr-pod-permission"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        node.kubernetes.io/ecr-pod-permission: "true"
      containers:
        - name: app
          image: ${ECR_TEAM_A_REPO_URL}:latest
          ports:
            - containerPort: 80
