# team-a pulling from team-b/ namespace using team-a ECR pull role — should FAIL ❌
# Uses sa-team-a-to-team-b → ECR pull role → AssumeRoleWithWebIdentity → gets team-a credentials
# → ECR repo policy on team-b/app denies team-a role → pull fails
#
# This proves: another team's ECR pull role cannot pull private images.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-team-a-to-team-b
  namespace: team-a
  annotations:
    eks.amazonaws.com/ecr-role-arn: ${ECR_PULL_ROLE_ARN_TEAM_A}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-a-to-team-b
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-a-to-team-b
  template:
    metadata:
      labels:
        app: team-a-to-team-b
    spec:
      tolerations:
        - key: "ecr-pod-permission"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        node.kubernetes.io/ecr-pod-permission: "true"
      serviceAccountName: sa-team-a-to-team-b
      containers:
        - name: app
          image: ${ECR_TEAM_B_REPO_URL}:latest
          ports:
            - containerPort: 80
