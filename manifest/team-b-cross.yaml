# team-b pulling from team-a/ namespace using team-b IRSA role — should FAIL ❌
# Uses team-b-cross-sa → IRSA → AssumeRoleWithWebIdentity → gets team-b credentials
# → ECR repo policy on team-a/nginxa denies team-b role → pull fails
#
# This proves: another team's IRSA role cannot pull private images.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-b-cross-sa
  namespace: team-b
  annotations:
    eks.amazonaws.com/ecr-role-arn: ${IRSA_ROLE_ARN_TEAM_B}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-b-cross
  namespace: team-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-b-cross
  template:
    metadata:
      labels:
        app: team-b-cross
    spec:
      tolerations:
        - key: "ecr-pod-permission"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        node.kubernetes.io/ecr-pod-permission: "true"
      serviceAccountName: team-b-cross-sa
      containers:
        - name: nginx
          image: ${ECR_TEAM_A_REPO_URL}:latest
          ports:
            - containerPort: 80
