# Node role (default SA, no ECR pull role) pulling from shared/ namespace — should FAIL ❌
# Uses default SA → no ECR pull role → falls back to node role
# → ECR repo policy on shared/app denies node role → pull fails
#
# This proves: the node IAM role cannot pull shared images either —
# only pods with a proper ECR pull role listed in the repo policy can.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-role-to-shared
  namespace: node-role
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-role-to-shared
  template:
    metadata:
      labels:
        app: node-role-to-shared
    spec:
      tolerations:
        - key: "ecr-pod-permission"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        node.kubernetes.io/ecr-pod-permission: "true"
      containers:
        - name: app
          image: ${ECR_SHARED_REPO_URL}:latest
          ports:
            - containerPort: 80
