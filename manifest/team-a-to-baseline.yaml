# team-a pulling from baseline/ namespace — should SUCCEED ✅
# Uses team-a IRSA role → baseline/app has no ECR repo policy → pull succeeds
#
# This proves: without a repository policy, any identity with IAM pull
# permissions can access the image — the default behavior this demo contrasts.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-team-a-to-baseline
  namespace: team-a
  annotations:
    eks.amazonaws.com/ecr-role-arn: ${IRSA_ROLE_ARN_TEAM_A}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-a-to-baseline
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-a-to-baseline
  template:
    metadata:
      labels:
        app: team-a-to-baseline
    spec:
      tolerations:
        - key: "ecr-pod-permission"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        node.kubernetes.io/ecr-pod-permission: "true"
      serviceAccountName: sa-team-a-to-baseline
      containers:
        - name: app
          image: ${ECR_BASELINE_REPO_URL}:latest
          ports:
            - containerPort: 80
