# team-a pulling from team-b/ namespace using team-a IRSA role — should FAIL ❌
# Uses team-a-cross-sa → IRSA → AssumeRoleWithWebIdentity → gets team-a credentials
# → ECR repo policy on team-b/nginxb denies team-a role → pull fails
#
# This proves: another team's IRSA role cannot pull private images.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-a-cross-sa
  namespace: team-a
  annotations:
    eks.amazonaws.com/ecr-role-arn: ${IRSA_ROLE_ARN_TEAM_A}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-a-cross
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-a-cross
  template:
    metadata:
      labels:
        app: team-a-cross
    spec:
      tolerations:
        - key: "ecr-pod-permission"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        node.kubernetes.io/ecr-pod-permission: "true"
      serviceAccountName: team-a-cross-sa
      containers:
        - name: nginx
          image: ${ECR_TEAM_B_REPO_URL}:latest
          ports:
            - containerPort: 80
