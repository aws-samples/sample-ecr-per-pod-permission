# No ECR IRSA (default SA) pulling from team-a/ namespace — should FAIL ❌
# Uses default SA → no IRSA → falls back to node role
# → ECR repo policy on team-a/app denies node role → pull fails
#
# This proves: the node IAM role cannot pull private team images.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-ecr-irsa-to-team-a
  namespace: no-ecr-irsa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-ecr-irsa-to-team-a
  template:
    metadata:
      labels:
        app: no-ecr-irsa-to-team-a
    spec:
      tolerations:
        - key: "ecr-pod-permission"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        node.kubernetes.io/ecr-pod-permission: "true"
      containers:
        - name: app
          image: ${ECR_TEAM_A_REPO_URL}:latest
          ports:
            - containerPort: 80
